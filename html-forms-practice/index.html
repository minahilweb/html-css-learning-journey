<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=<device-width>, initial-scale=1.0">
    <title>forms</title>
</head>
<body>
    <h1>Forms for Admission</h1>
    <form method="post">
        <div>
             <label for="username">Username:</label>
             <input type="text" id="username" placeholder="Enter your name" >
        </div>

        <div>
             <label for="number">Phone Number:</label>
             <input type="number" placeholder="enter the number" id="number" required>
        </div>

        <div>
             <label for="email">Email:</label>
             <input type="email" placeholder="Enter Your email" id="email" autofocus>
        </div>

         Gender:
        <div>
             <input type="radio" name="gender" value="Male">Male
             <input type="radio" name="gender" value="female">female
        </div>
        
        <div>
         Choose your skills:
             <input type="checkbox" name="skill" value="Java">Java
             <input type="checkbox" name="skill" value="Python">Python
             <input type="checkbox" name="skill" value="Web development">Web development
             <input type="checkbox" name="skill" value="App development">App development
        </div>
         

    </form>
</body>
</html>
