<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Images, Lists & Tables</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- How to add image -->
    <img width="250" height="250" src="lion.jpg" alt="lion image" />

    <!-- How to add table -->
    <table>
        <caption>Student</caption>
        <tr>
            <th>Name</th>
            <th>Class</th>
            <th>Rollno</th>
            <th>Subject</th>
        </tr>
        <tr>
            <td>Minahil</td>
            <td>BS-IT</td>
            <td>29</td>
            <td>IT</td>
        </tr>
        <tr>
            <td colspan="2">Minahil in IT</td>
            <td>29</td>
            <td>IT</td>
        </tr>
    </table>
</body>
</html>
